<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استبيان تجهيز الموقع الإلكتروني</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        header p {
            color: #64748b;
            font-size: 1.1rem;
        }

        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }

        .section-card h2 {
            margin-top: 0;
            font-size: 1.4rem;
            color: var(--primary);
            border-bottom: 2px solid var(--bg);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .optional {
            font-weight: normal;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 100%;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #successMessage {
            display: none;
            background: #bbf7d0;
            color: #166534;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>دعنا نبني موقعك الاحترافي</h1>
        <p>يرجى ملء هذا الاستبيان بدقة لمساعدتنا في تصميم وبرمجة موقعك بدون أخطاء.</p>
    </header>

    <form id="mainClientForm">
        <!-- القسم الأول -->
        <div class="section-card">
            <h2>1. الهوية البصرية والمعلومات الأساسية</h2>
            <div class="form-group">
                <label>ما هو الاسم الرسمي للمشروع أو الموقع؟ *</label>
                <input type="text" name="projectName" required>
            </div>
            <div class="form-group">
                <label>رابط الشعار (أو وصفه إذا لم يكن جاهزاً) <span class="optional">(اختياري)</span></label>
                <input type="text" name="logoLink">
            </div>
            <div class="form-group">
                <label>الألوان الأساسية المفضلة للموقع؟ *</label>
                <input type="text" name="colors" placeholder="مثال: أزرق ملكي وأبيض" required>
            </div>
            <div class="form-group">
                <label>روابط مواقع منافسة أو تصاميم تعجبك:</label>
                <textarea name="competitors" rows="3"></textarea>
            </div>
        </div>

        <!-- القسم الثاني -->
        <div class="section-card">
            <h2>2. تفاصيل صفحة توفير المنتجات (Sourcing)</h2>
            <div class="form-group">
                <label>هل تريد إضافة حقول أخرى لنموذج طلب المنتجات؟</label>
                <textarea name="extraSourcingFields" rows="2" placeholder="النموذج الافتراضي يحتوي على: الصورة، الاسم، الكمية، الرابط، الملاحظات."></textarea>
            </div>
            <div class="form-group">
                <label>أين تفضل استقبال طلبات المنتجات؟ *</label>
                <select name="receiveMethod" required>
                    <option value="الواتساب">رسالة مباشرة على الواتساب</option>
                    <option value="البريد الإلكتروني">عبر البريد الإلكتروني</option>
                    <option value="لوحة تحكم مستقبلاً">حفظ في لوحة تحكم خاصة مستقبلاً</option>
                </select>
            </div>
            <div class="form-group">
                <label>رقم الواتساب أو البريد المخصص لاستقبال الطلبات: *</label>
                <input type="text" name="contactInfo" required>
            </div>
        </div>

        <!-- القسم الثالث -->
        <div class="section-card">
            <h2>3. تفاصيل خدمة الـ VIP والدعم</h2>
            <div class="form-group">
                <label>اكتب المميزات الدقيقة لباقة الـ VIP بالتفصيل: *</label>
                <textarea name="vipFeatures" rows="4" placeholder="مثال: منتجات رابحة يومياً، دعم 24 ساعة..." required></textarea>
            </div>
            <div class="form-group">
                <label>سعر الاشتراك في خدمة الـ VIP ومجموعة التيليجرام: *</label>
                <input type="text" name="vipPriceAndTelegram" placeholder="مثال: 49$ شهرياً / رابط القناة" required>
            </div>
            <div class="form-group">
                <label>روابط حسابات التواصل وسياسة الموقع <span class="optional">(اختياري)</span></label>
                <textarea name="socialAndTerms" rows="3"></textarea>
            </div>
        </div>

        <button type="submit" id="submitBtn">إرسال البيانات إلى المطور</button>
    </form>

    <div id="successMessage">🎉 تم إرسال إجاباتك بنجاح! شكراً لك، سنبدأ العمل فوراً.</div>
</div>

<script>
    // ضع هنا رابط Google Apps Script بعد استخراجه (الخطوة الثانية)
    const scriptURL = 'YOUR_GOOGLE_SCRIPT_URL_HERE';
    const form = document.getElementById('mainClientForm');
    const submitBtn = document.getElementById('submitBtn');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerText = 'جاري الإرسال والتحقق...';

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                form.style.display = 'none';
                successMessage.style.display = 'block';
            })
            .catch(error => {
                console.error('Error!', error.message);
                alert('حدث خطأ أثناء الإرسال، يرجى المحاولة مرة أخرى.');
                submitBtn.disabled = false;
                submitBtn.innerText = 'إرسال البيانات إلى المطور';
            });
    });
</script>
</body>
</html>
